  <!-- JODHPUR VOYAGE Brand Typography -->
  <text x="200" y="188" text-anchor="middle" font-family="'Impact', 'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="42" fill="#d97706" letter-spacing="3">
